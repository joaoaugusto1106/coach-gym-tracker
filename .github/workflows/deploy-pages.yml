
# Publishes Coach to GitHub Pages.
#
# There is no build step — the repository root IS the site — so this uploads the
# checkout as-is. The app uses only relative URLs, so it works unchanged at the
# project-page subpath (…github.io/coach-gym-tracker/) as well as at a domain root.
#
# ONE-TIME SETUP, done by hand: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". This job cannot do it for you -- the default
# GITHUB_TOKEN is not allowed to create a Pages site ("Resource not accessible
# by integration"), whatever permissions the workflow requests, so the very
# first run fails at Configure Pages until the source is set.
#
# To ship an update: bump VERSION in sw.js and merge to main. Installed copies
# pick it up in the background and offer a "Reload" bar.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs to read the checkout and publish the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race. In-progress runs are allowed to finish so a
# half-published site is never left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # No enablement: true here -- it reads as though it would switch Pages on,
      # but GITHUB_TOKEN cannot create a Pages site, so it only turns a clear
      # "set the source to GitHub Actions" into a confusing permissions error.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
