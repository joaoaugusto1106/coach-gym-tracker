<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach — Health bridge tests</title>
<style>
  body{font:14px/1.5 -apple-system,system-ui,sans-serif; margin:24px; max-width:880px}
  h1{font-size:18px}
  .ok{color:#1a7f37} .fail{color:#c4362a; font-weight:700}
  .row{padding:3px 0; border-bottom:1px solid #eee}
  #summary{margin:14px 0; font-weight:700; font-size:15px}
  .note{background:#f6f6f4; padding:10px 12px; border-radius:8px; font-size:13px; margin:12px 0}
</style>
</head>
<body>
<h1>Coach — Apple Health write bridge (Stage 7)</h1>
<p class="note">Tests the payload, the URL hand-off, and the guards around them.
It cannot test Shortcuts or HealthKit — those live outside the browser. Verify
those on the iPhone; see <code>shortcuts/log-strength-workout.md</code>.</p>
<div id="summary">running…</div>
<div id="out"></div>

<script src="../js/util.js"></script>
<script src="../js/data.js"></script>
<script src="../js/model.js"></script>
<script src="../js/health.js"></script>
<script>
(function () {
  var H = App.health, M = App.model, out = document.getElementById("out"), pass = 0, fail = 0;
  function ok(name, cond) {
    var d = document.createElement("div");
    d.className = "row " + (cond ? "ok" : "fail");
    d.textContent = (cond ? "PASS  " : "FAIL  ") + name;
    out.appendChild(d); cond ? pass++ : fail++;
  }
  function eq(name, a, b) { ok(name + "  → " + JSON.stringify(a), JSON.stringify(a) === JSON.stringify(b)); }

  function S(w, r, type) {
    return { id: "s", order: 0, type: type || "working", weightKg: w, reps: r, rir: 2,
      e1rm: M.epley(w, r), prFlags: [] };
  }
  function session(startedAt, endedAt, entries) {
    return { id: "sess-1", dayName: "Upper · Push", date: "2026-09-02",
      startedAt: startedAt, endedAt: endedAt, status: "completed", entries: entries || [] };
  }
  var st = { settings: { healthWriteShortcutName: "Log Strength Workout" }, sessions: [], exercises: App.EXERCISE_SEED };

  // ---- duration ----
  eq("duration comes from the session's own timestamps",
    H.suggestedMinutes(session("2026-09-02T08:30:00Z", "2026-09-02T09:22:00Z")), 52);
  eq("a draft left open overnight is clamped, not written as 14 hours",
    H.suggestedMinutes(session("2026-09-02T08:00:00Z", "2026-09-03T02:00:00Z")), H.MAX_MINUTES);
  eq("an implausibly short session is floored",
    H.suggestedMinutes(session("2026-09-02T08:00:00Z", "2026-09-02T08:00:30Z")), H.MIN_MINUTES);
  eq("missing timestamps fall back to something sane",
    H.suggestedMinutes(session("2026-09-02T08:00:00Z", null)), 60);
  eq("clamping is reported so the UI can say so",
    [H.wasClamped(session("2026-09-02T08:00:00Z", "2026-09-03T02:00:00Z")),
     H.wasClamped(session("2026-09-02T08:30:00Z", "2026-09-02T09:22:00Z"))], [true, false]);

  // ---- what gets counted ----
  var withSets = session("2026-09-02T08:30:00Z", "2026-09-02T09:22:00Z", [
    { sets: [S(60, 5, "warmup"), S(100, 8), S(100, 8)] },
    { sets: [S(40, 10), S(20, 15, "drop")] }
  ]);
  eq("only working sets are counted", H.workingSetsOf(withSets).sets, 3);
  eq("volume is weight x reps over working sets only", H.workingSetsOf(withSets).volumeKg, 100 * 8 + 100 * 8 + 40 * 10);
  eq("an empty session counts nothing", H.workingSetsOf(session("a", "b", [])), { sets: 0, volumeKg: 0 });

  // ---- payload ----
  var p = H.payload(st, withSets, 52);
  eq("payload is versioned", p.v, 1);
  eq("workout type is Functional Strength Training", p.type, "Functional Strength Training");
  eq("start is the session start", p.start, "2026-09-02T08:30:00Z");
  eq("duration is carried explicitly", p.durationMin, 52);
  ok("end is derived from the duration you confirmed, not the raw timestamp",
    new Date(p.end) - new Date(p.start) === 52 * 60000);
  eq("exercises counts only those with sets logged", p.exercises, 2);
  eq("the session id travels so it can be traced", p.sessionId, "sess-1");

  // the privacy guarantee: a summary, never the training detail
  var text = H.payloadText(p);
  ok("payload never contains per-set weights", text.indexOf('"weightKg"') < 0);
  ok("payload never contains reps", text.indexOf('"reps"') < 0);
  ok("payload never contains RIR", text.toLowerCase().indexOf('"rir"') < 0);
  ok("payload never contains notes", text.indexOf('"note"') < 0);
  ok("payload never contains body weight", text.indexOf('"bodyweight"') < 0 && text.indexOf('"kg"') < 0);
  ok("payload stays small enough for a URL", text.length < 400);

  // a shorter duration must move the end, not just the label
  var pShort = H.payload(st, withSets, 30);
  ok("changing the duration changes what Health will record",
    new Date(pShort.end) - new Date(pShort.start) === 30 * 60000);

  // ---- an easy ride ----
  // Health has a real type for cycling; logging a ride as strength training
  // would put it in the wrong place in Fitness and make the numbers junk.
  (function () {
    var ride = { id: "c-1", date: "2026-03-04", kind: "bike", minutes: 48,
      avgHrBpm: 131, effort: "easy", note: "river loop" };
    var cp = H.cardioPayload(ride);

    eq("a ride is typed as Cycling, not strength training", cp.type, "Cycling");
    eq("the ride id travels so it can be traced", cp.cardioId, "c-1");
    eq("it keeps the day it was logged for", cp.date, "2026-03-04");
    eq("duration is what was logged", cp.durationMin, 48);
    ok("the window matches the duration exactly",
      new Date(cp.end) - new Date(cp.start) === 48 * 60000);
    ok("and lands on the logged day, not today",
      cp.start.indexOf("2026-03-04") === 0 || cp.end.indexOf("2026-03-04") === 0);

    // the same privacy line as a lifting session
    var ct = H.payloadText(cp);
    ok("a ride payload carries no note", ct.indexOf("river loop") < 0);
    ok("and no heart rate", ct.indexOf("131") < 0 && ct.toLowerCase().indexOf("hr") < 0);
    ok("and stays small enough for a URL", ct.length < 400);

    // garbage in must not become a garbage workout in Health
    eq("zero minutes is clamped to something loggable",
      H.cardioPayload({ id: "c", date: "2026-03-04", minutes: 0 }).durationMin, 1);
    eq("an absurd duration is clamped rather than sent",
      H.cardioPayload({ id: "c", date: "2026-03-04", minutes: 99999 }).durationMin, 600);
    ok("a broken date still yields a valid window", (function () {
      var bad = H.cardioPayload({ id: "c", date: "not-a-date", minutes: 30 });
      return !isNaN(new Date(bad.start).getTime()) && !isNaN(new Date(bad.end).getTime());
    })());

    var curl = H.shortcutURL("Log Strength Workout", cp);
    ok("a ride uses the same documented scheme", curl.indexOf("shortcuts://run-shortcut?") === 0);
  })();

  // ---- URL ----
  var url = H.shortcutURL("Log Strength Workout", p);
  ok("uses the documented shortcuts:// scheme", url.indexOf("shortcuts://run-shortcut?") === 0);
  ok("passes the name", url.indexOf("name=Log%20Strength%20Workout") > -1);
  ok("declares text input", url.indexOf("input=text") > -1);
  ok("the payload is URL-encoded", url.indexOf("text=%7B%22v%22%3A1") > -1);
  ok("no raw braces or quotes leak into the URL",
    url.indexOf("{") < 0 && url.indexOf('"') < 0 && url.indexOf(" ") < 0);
  ok("a name with spaces and punctuation survives encoding", (function () {
    var u = H.shortcutURL("João's Log & Save", p);
    return u.indexOf("Jo%C3%A3o's%20Log%20%26%20Save") > -1 || u.indexOf("Jo%C3%A3o%27s%20Log%20%26%20Save") > -1;
  })());
  eq("a missing name falls back to the documented default",
    H.shortcutURL(null, p).indexOf("name=Log%20Strength%20Workout") > -1, true);
  ok("decoding the URL gives back exactly the payload", (function () {
    var enc = url.split("&text=")[1];
    return JSON.stringify(JSON.parse(decodeURIComponent(enc))) === JSON.stringify(p);
  })());

  // ---- round trip through what the Shortcut will actually read ----
  ok("the Shortcut can recover start, end and type from the JSON", (function () {
    var got = JSON.parse(decodeURIComponent(url.split("&text=")[1]));
    return got.start === p.start && got.end === p.end && got.type === "Functional Strength Training" &&
      !isNaN(new Date(got.start).getTime()) && !isNaN(new Date(got.end).getTime());
  })());
  ok("end is always after start", new Date(p.end) > new Date(p.start));

  // ---- platform guard ----
  App.env = { isIOS: function () { return false; } };
  eq("non-Apple devices are told the bridge can't work there", H.isSupported(), false);
  App.env = { isIOS: function () { return true; } };
  eq("iPhone is supported", H.isSupported(), true);

  // ================= Stage 8: the read path =================
  function parse(x) { return H.parseReadPayload(typeof x === "string" ? x : JSON.stringify(x)); }
  var TODAY = M.perthTodayISO();

  // ---- happy paths ----
  var one = parse({ v: 1, date: TODAY, hrvMs: 48.2, restingHrBpm: 52, sleepHours: 7.4 });
  eq("a single day parses", one.ok, true);
  eq("   values come through", [one.days[0].hrvMs, one.days[0].restingHrBpm, one.days[0].sleepHours], [48.2, 52, 7.4]);
  eq("   with no warnings", one.warnings.length, 0);
  eq("several days parse", parse({ v: 1, days: [
    { date: "2026-09-01", hrvMs: 49 }, { date: "2026-09-02", hrvMs: 44 }] }).days.length, 2);
  eq("a bare array parses too", parse([{ date: "2026-09-01", hrvMs: 49 }]).days.length, 1);
  eq("days come back newest first", parse({ days: [
    { date: "2026-09-01", hrvMs: 49 }, { date: "2026-09-02", hrvMs: 44 }] }).days[0].date, "2026-09-02");
  eq("duplicate dates collapse to one", parse({ days: [
    { date: "2026-09-01", hrvMs: 49 }, { date: "2026-09-01", hrvMs: 44 }] }).days.length, 1);
  eq("shorthand keys are accepted", parse({ date: TODAY, hrv: 50, restingHr: 51, sleep: 7 }).days[0].hrvMs, 50);
  eq("a comma decimal is understood", parse({ date: TODAY, hrvMs: "48,5" }).days[0].hrvMs, 48.5);
  eq("JSON wrapped in quotes by the Shortcut still parses",
    H.parseReadPayload('"' + JSON.stringify({ date: TODAY, hrvMs: 48 }).replace(/"/g, '\\"') + '"').ok, true);
  eq("missing date defaults to today", parse({ hrvMs: 48 }).days[0].date, TODAY);
  eq("a datetime is trimmed to its date", parse({ date: "2026-09-01T22:14:00Z", hrvMs: 48 }).days[0].date, "2026-09-01");

  // ---- partial data is still worth having ----
  var partial = parse({ date: TODAY, sleepHours: 6.5 });
  eq("sleep alone is a successful import", partial.ok, true);
  eq("   the others stay null rather than 0", [partial.days[0].hrvMs, partial.days[0].restingHrBpm], [null, null]);

  // ---- garbage in ----
  eq("empty input is rejected", parse("").ok, false);
  eq("non-JSON is rejected", H.parseReadPayload("hello there").ok, false);
  ok("   with an actionable message", /valid JSON/.test(H.parseReadPayload("hello").fatal));
  var denied = parse({ v: 1, error: "denied" });
  eq("a denied-permission payload is rejected", denied.ok, false);
  ok("   and says exactly where to fix it", /Health → Sharing/.test(denied.fatal));
  var emptyDay = parse({ v: 1, date: TODAY });
  eq("a day with no metrics at all is rejected", emptyDay.ok, false);
  ok("   and explains why it's probably empty", /no data for that day|permission/.test(emptyDay.fatal));

  // ---- unit and sanity guards ----
  var mins = parse({ date: TODAY, sleepHours: 444 });
  eq("sleep in minutes is NOT silently converted", mins.ok, false);
  ok("   it names the exact fix", /looks like minutes/.test(mins.warnings[0]) && /Divide by 60/.test(mins.warnings[0]));
  var wildHrv = parse({ date: TODAY, hrvMs: 2000, restingHrBpm: 52 });
  eq("an impossible HRV is dropped but the rest survives", wildHrv.days[0].restingHrBpm, 52);
  eq("   and the impossible value is gone", wildHrv.days[0].hrvMs, null);
  ok("   with a warning naming the plausible range", /outside anything plausible/.test(wildHrv.warnings[0]));
  eq("an impossible resting HR is dropped", parse({ date: TODAY, restingHrBpm: 250, hrvMs: 48 }).days[0].restingHrBpm, null);
  eq("text where a number should be is dropped", parse({ date: TODAY, hrvMs: "abc", sleepHours: 7 }).days[0].hrvMs, null);
  var future = parse({ date: M.addDays(TODAY, 3), hrvMs: 48 });
  eq("a future-dated reading is refused", future.ok, false);
  ok("   pointing at the Shortcut's date step", /future/.test(future.warnings[0]));
  ok("an unreadable date is reported", /YYYY-MM-DD/.test(parse({ date: "yesterday-ish", hrvMs: 48 }).warnings.join(" ")));

  // ---- merging into state ----
  var stateA = { recoveryReadings: [] };
  H.applyReadings(stateA, parse({ date: "2026-09-01", hrvMs: 49, restingHrBpm: 51, sleepHours: 7.2 }).days, "shortcut");
  eq("import adds a day", stateA.recoveryReadings.length, 1);
  eq("   tagged with its source", stateA.recoveryReadings[0].source, "shortcut");
  var counts = H.applyReadings(stateA, parse({ date: "2026-09-01", sleepHours: 6.0 }).days, "shortcut");
  eq("re-importing the same date updates rather than duplicating", stateA.recoveryReadings.length, 1);
  eq("   and reports it as an update", [counts.added, counts.updated], [0, 1]);
  eq("   sleep was replaced", stateA.recoveryReadings[0].sleepHours, 6);
  eq("   but HRV was NOT wiped by the partial import", stateA.recoveryReadings[0].hrvMs, 49);
  H.applyReadings(stateA, parse({ date: "2026-08-30", hrvMs: 47 }).days, "manual");
  eq("readings stay sorted oldest first", stateA.recoveryReadings[0].date, "2026-08-30");
  eq("manual entries record their source", stateA.recoveryReadings[0].source, "manual");

  // ---- imported readings actually reach the baselines ----
  ok("imported numbers feed the recovery baselines", (function () {
    var st2 = { settings: {}, recoveryReadings: [], readinessCheckins: [] };
    var days = [];
    for (var i = 12; i >= 1; i--) days.push({ date: M.addDays(TODAY, -i), hrvMs: 50, restingHrBpm: 51, sleepHours: 7.5 });
    H.applyReadings(st2, parse({ days: days }).days, "shortcut");
    var b = M.recoveryBaselines(st2, TODAY);
    return b.hrvMs.n === 12 && b.hrvMs.median === 50;
  })());
  ok("a bad night in imported data reads as amber, never red", (function () {
    var st3 = { settings: {}, recoveryReadings: [], readinessCheckins: [] };
    var days = [];
    for (var i = 12; i >= 1; i--) days.push({ date: M.addDays(TODAY, -i), hrvMs: 50, restingHrBpm: 51, sleepHours: 7.5 });
    days.push({ date: TODAY, hrvMs: 20, restingHrBpm: 68, sleepHours: 4 });
    H.applyReadings(st3, parse({ days: days }).days, "shortcut");
    return M.readiness(st3, TODAY).status === "amber";
  })());

  // ---- the read URL ----
  var rurl = H.readShortcutURL("Read Recovery");
  ok("read URL uses the same documented scheme", rurl.indexOf("shortcuts://run-shortcut?name=") === 0);
  ok("read URL encodes the name", rurl.indexOf("Read%20Recovery") > -1);
  ok("read URL sends no input — it only fetches", rurl.indexOf("text=") < 0);
  ok("a missing read name falls back to the default", H.readShortcutURL(null).indexOf("Read%20Recovery") > -1);

  document.getElementById("summary").innerHTML =
    (fail === 0 ? '<span class="ok">' : '<span class="fail">') + pass + " passed, " + fail + " failed</span>";
})();
</script>
</body>
</html>
