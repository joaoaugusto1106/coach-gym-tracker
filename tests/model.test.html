<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach — model tests</title>
<style>
  body{font:14px/1.5 -apple-system,system-ui,sans-serif; margin:24px; max-width:820px}
  h1{font-size:18px}
  .ok{color:#1a7f37} .fail{color:#c4362a; font-weight:700}
  .row{padding:3px 0; border-bottom:1px solid #eee; font-variant-numeric:tabular-nums}
  #summary{margin:14px 0; font-weight:700; font-size:15px}
</style>
</head>
<body>
<h1>Coach — model tests</h1>
<div id="summary">running…</div>
<div id="out"></div>

<script src="../js/util.js"></script>
<script src="../js/data.js"></script>
<script src="../js/model.js"></script>
<script>
(function () {
  var M = App.model, out = document.getElementById("out"), pass = 0, fail = 0;
  function ok(name, cond) {
    var d = document.createElement("div");
    d.className = "row " + (cond ? "ok" : "fail");
    d.textContent = (cond ? "PASS  " : "FAIL  ") + name;
    out.appendChild(d);
    cond ? pass++ : fail++;
  }
  function eq(name, a, b) { ok(name + "  → " + JSON.stringify(a), JSON.stringify(a) === JSON.stringify(b)); }
  function S(w, r, rir, type) { return { id: "x", weightKg: w, reps: r, rir: rir, type: type || "working", e1rm: M.epley(w, r), prFlags: [] }; }

  // --- Epley ---
  ok("epley 60x10 == 80", Math.abs(M.epley(60, 10) - 80) < 1e-9);
  ok("epley 100x1 == 103.33", Math.abs(M.epley(100, 1) - (100 + 100 / 30)) < 1e-9);

  // --- calendar clock (phase / week) ---
  var pi = M.phaseInfo({ phaseStartDate: "2026-01-01", phaseLengthWeeks: 6 }, "2026-01-01");
  eq("phase 1 wk 1 on start day", [pi.phase, pi.week], [1, 1]);
  pi = M.phaseInfo({ phaseStartDate: "2026-01-01", phaseLengthWeeks: 6 }, "2026-02-13");
  eq("phase 2 wk 1 after ~6 weeks", [pi.phase, pi.week], [2, 1]);
  eq("deload flag on last week of phase",
    M.phaseInfo({ phaseStartDate: "2026-01-01", phaseLengthWeeks: 6 }, "2026-02-05").isDeloadWeek, true);

  // --- program version selection by effective date ---
  var st2 = {
    programVersions: [
      { id: "pv1", name: "v1", effectiveStartDate: "2026-01-01", trainingDayOrder: ["push", "lower", "pull", "arms"], days: seedDays() },
      { id: "pv2", name: "v2", effectiveStartDate: "2026-03-01", trainingDayOrder: ["push", "lower", "pull", "arms"], days: seedDays() }
    ], activeProgramVersionId: "pv2", rotationIndex: 0
  };
  eq("active program before pv2 effective date", M.activeProgram(st2, "2026-02-15").id, "pv1");
  eq("active program on/after pv2 effective date", M.activeProgram(st2, "2026-03-10").id, "pv2");

  // --- A/B/C variants, chosen by the phase number ---
  // A version records the program changing (by date, above). A variant is the
  // same program's rotating selection, and is picked by phase instead.
  (function () {
    function vday(id, exId) {
      return { id: id, name: id, slots: [{ planSlotId: id + ".s1", label: "Primary",
        defaultExerciseId: exId, allowedExerciseIds: [exId], sets: 3, repLow: 8, repHigh: 12, rir: 2 }] };
    }
    function pvWithVariants() {
      return {
        id: "pv1", name: "v1", effectiveStartDate: "2026-01-01",
        trainingDayOrder: ["push"], days: [vday("push", "a-lift")],
        variants: [
          { id: "A", name: "A block", days: [vday("push", "a-lift")] },
          { id: "B", name: "B block", days: [vday("push", "b-lift")] },
          { id: "C", name: "C block", days: [vday("push", "c-lift")] }
        ]
      };
    }
    var stv = {
      settings: { phaseStartDate: "2026-01-01", phaseLengthWeeks: 6 },
      programVersions: [pvWithVariants()], activeProgramVersionId: "pv1", rotationIndex: 0
    };
    function liftOn(dateIso) { return M.activeProgram(stv, dateIso).days[0].slots[0].defaultExerciseId; }

    eq("phase 1 runs variant A", liftOn("2026-01-01"), "a-lift");
    eq("phase 2 runs variant B", liftOn("2026-02-13"), "b-lift");
    eq("phase 3 runs variant C", liftOn("2026-03-27"), "c-lift");
    eq("phase 4 wraps back to A", liftOn("2026-05-08"), "a-lift");
    eq("the variant id is reported", M.activeProgram(stv, "2026-02-13").variantId, "B");

    // the whole phase runs one variant — it must not change mid-block
    eq("variant is stable across the phase",
      [liftOn("2026-02-13"), liftOn("2026-03-01"), liftOn("2026-03-20")], ["b-lift", "b-lift", "b-lift"]);

    // the stored version is the source of truth and must never be mutated
    M.activeProgram(stv, "2026-02-13");
    eq("selecting a variant never mutates the stored version",
      stv.programVersions[0].days[0].slots[0].defaultExerciseId, "a-lift");

    // a version with no variants still works — this is what old saved data looks like
    var stPlain = {
      settings: { phaseStartDate: "2026-01-01", phaseLengthWeeks: 6 },
      programVersions: [{ id: "pv1", name: "v1", effectiveStartDate: "2026-01-01",
        trainingDayOrder: ["push"], days: [vday("push", "only-lift")] }],
      activeProgramVersionId: "pv1", rotationIndex: 0
    };
    eq("a version with no variants falls back to its days",
      M.activeProgram(stPlain, "2026-03-27").days[0].slots[0].defaultExerciseId, "only-lift");
    eq("and reports no variant", M.activeProgram(stPlain, "2026-03-27").variantId, undefined);
  })();

  // --- the shipped seed actually has three usable variants ---
  (function () {
    var vs = App.PROGRAM_SEED.variants;
    eq("seed ships three variants", vs.length, 3);
    eq("they are A, B, C", vs.map(function (v) { return v.id; }), ["A", "B", "C"]);
    var known = {};
    App.EXERCISE_SEED.forEach(function (e) { known[e.id] = true; });
    var unknown = [], dayIds = [], slotCounts = [];
    vs.forEach(function (v) {
      dayIds.push(v.days.map(function (d) { return d.id; }).join(","));
      v.days.forEach(function (d) {
        slotCounts.push(d.slots.length);
        d.slots.forEach(function (sl) {
          sl.allowedExerciseIds.forEach(function (id) { if (!known[id]) unknown.push(v.id + ":" + id); });
        });
      });
    });
    eq("every exercise a variant names exists in the catalog", unknown, []);
    eq("all three variants have the same four days", dayIds,
      ["push,lower,pull,arms", "push,lower,pull,arms", "push,lower,pull,arms"]);
    ok("every day has six slots in every variant",
      slotCounts.length === 12 && slotCounts.every(function (n) { return n === 6; }));
    // B and C have to actually differ from A or the rotation is decorative
    function firstLift(v) { return v.days[0].slots[0].defaultExerciseId; }
    ok("B differs from A on the primary press", firstLift(vs[0]) !== firstLift(vs[1]));
    ok("C differs from A somewhere in the prescription",
      JSON.stringify(vs[0].days) !== JSON.stringify(vs[2].days));
  })();
  eq("programShortName", M.programShortName({ id: "pv3" }), "v3");

  // --- rotation clock ---
  function seedDays() {
    return ["push", "lower", "pull", "arms"].map(function (id) {
      return { id: id, name: id, slots: [{ planSlotId: id + ".s1", defaultExerciseId: "bb-bench", allowedExerciseIds: ["bb-bench"], sets: 3, repLow: 6, repHigh: 9, rir: 2, loadIncrementKg: null }] };
    });
  }
  var stRot = { programVersions: [{ id: "pv1", effectiveStartDate: "2000-01-01", trainingDayOrder: ["push", "lower", "pull", "arms"], days: seedDays() }], activeProgramVersionId: "pv1", rotationIndex: 0 };
  eq("rotationIndex 0 → push", M.nextDay(stRot).dayId, "push");
  stRot.rotationIndex = 1; eq("rotationIndex 1 → lower", M.nextDay(stRot).dayId, "lower");
  stRot.rotationIndex = 4; eq("rotationIndex 4 wraps → push", M.nextDay(stRot).dayId, "push");
  eq("rotationDayInfo maps a manual day to its index", M.rotationDayInfo(stRot, "pull").dayIndex, 2);

  // --- seed integrity ---
  ok("every seed exercise has a movement family",
    App.EXERCISE_SEED.every(function (e) { return !!e.movementFamilyId; }));
  ok("incline press variants share a family",
    ["incline-db-press", "incline-machine-press", "incline-bb-press", "incline-smith-press"]
      .map(function (id) { return App.EXERCISE_SEED.filter(function (e) { return e.id === id; })[0].movementFamilyId; })
      .every(function (f, _, arr) { return f === arr[0]; }));
  ok("dumbbell default increment is 2kg",
    App.EXERCISE_SEED.filter(function (e) { return e.id === "incline-db-press"; })[0].defaultLoadIncrementKg === 2);
  ok("seed program has planSlotId on every slot",
    App.PROGRAM_SEED.days.every(function (d) { return d.slots.every(function (s) { return !!s.planSlotId; }); }));

  // --- PR detection ---
  eq("no history → no PR", M.prsForSet([], S(100, 5, 2)), []);
  eq("heavier than ever → weight + e1rm", M.prsForSet([S(60, 8, 2)], S(62.5, 8, 2)), ["weight", "e1rm"]);
  eq("more reps at a known weight → repsAtWeight", M.prsForSet([S(60, 8, 2), S(60, 9, 2)], S(60, 10, 1)).sort(), ["e1rm", "repsAtWeight"]);
  eq("weaker set → nothing", M.prsForSet([S(60, 8, 2), S(70, 5, 0)], S(60, 7, 3)), []);
  eq("equal to best → nothing (must beat)", M.prsForSet([S(60, 8, 2)], S(60, 8, 2)), []);
  eq("e1rm-only PR", M.prsForSet([S(60, 5, 2), S(50, 10, 2)], S(57.5, 9, 1)), ["e1rm"]);
  eq("prLabel priority weight", M.prLabel(["weight", "e1rm"], 65), "Heaviest");
  eq("prLabel reps over e1rm", M.prLabel(["e1rm", "repsAtWeight"], 40), "Most reps @ 40 kg");

  // --- working sets vs warm-up / drop ---
  eq("workingSets excludes warm-up and drop",
    M.workingSets([S(40, 5, 4, "warmup"), S(60, 8, 2, "working"), S(50, 12, 0, "drop")]).length, 1);

  // --- last-time recall respects session status ---
  function sess(id, status, exId, sets) {
    return { id: id, status: status, date: "2026-08-2" + id, startedAt: "2026-08-2" + id + "T16:00:00Z",
      phase: 1, week: 2, entries: [{ exerciseId: exId, sets: sets }] };
  }
  var stLP = { exercises: App.EXERCISE_SEED, activeSession: null, sessions: [
    sess("1", "completed", "bb-bench", [S(60, 8, 2)]),
    sess("2", "abandoned", "bb-bench", [S(999, 1, 0)]),
    sess("3", "draft", "bb-bench", [S(888, 1, 0)])
  ] };
  eq("lastPerformance ignores abandoned + draft", M.lastPerformance(stLP, "bb-bench").sets[0].weightKg, 60);
  eq("lastPerformance ignores warm-up-only entries",
    M.lastPerformance({ exercises: App.EXERCISE_SEED, sessions: [sess("1", "completed", "bb-bench", [S(40, 5, 4, "warmup")])] }, "bb-bench"), null);

  var ex = App.EXERCISE_SEED;

  // --- overload suggestion ---
  function stateWithLast(exId, sets) {
    return { exercises: ex, activeSession: null,
      sessions: [{ id: "s1", status: "completed", date: "2026-08-25", startedAt: "2026-08-25T16:00:00Z", phase: 1, week: 2, entries: [{ exerciseId: exId, sets: sets }] }] };
  }
  var slot = { sets: 4, repLow: 6, repHigh: 9, rir: 2, loadIncrementKg: null };
  eq("all at top of range, RIR≥2 → push",
    M.overloadSuggestion(stateWithLast("bb-bench", [S(60, 9, 2), S(60, 9, 2), S(60, 9, 3), S(60, 9, 2)]), "bb-bench", slot).tone, "push");
  eq("in range, not at top → hold",
    M.overloadSuggestion(stateWithLast("bb-bench", [S(60, 7, 2), S(60, 7, 2), S(60, 7, 2), S(60, 7, 2)]), "bb-bench", slot).tone, "hold");
  eq("a set below the rep floor → back",
    M.overloadSuggestion(stateWithLast("bb-bench", [S(60, 8, 2), S(60, 4, 0)]), "bb-bench", slot).tone, "back");
  eq("no history → none / confidence none",
    [M.overloadSuggestion({ exercises: ex, sessions: [] }, "bb-bench", slot).tone,
     M.overloadSuggestion({ exercises: ex, sessions: [] }, "bb-bench", slot).confidence], ["none", "none"]);
  // --- deload week ---
  // The last week of a phase is the program, not a mood: it is allowed to set
  // the target. But it only ever overrides "add load", and it never rewrites
  // the prescription.
  (function () {
    // phaseStartDate chosen so the reference date lands in week 6 of phase 1
    var DELOAD = { phaseStartDate: "2026-01-01", phaseLengthWeeks: 6 };   // 2026-02-05 = wk 6
    var NORMAL = { phaseStartDate: "2026-01-01", phaseLengthWeeks: 6 };   // 2026-01-15 = wk 3
    function stWith(settings, sets) {
      var st = stateWithLast("bb-bench", sets);
      st.settings = settings;
      return st;
    }
    var topped = [S(60, 9, 2), S(60, 9, 2), S(60, 9, 2), S(60, 9, 2)];
    var midRange = [S(60, 7, 2), S(60, 7, 2), S(60, 7, 2), S(60, 7, 2)];

    eq("deloadInfo is null in a normal week",
      M.deloadInfo({ settings: NORMAL }, "2026-01-15"), null);
    ok("deloadInfo fires in the last week of the phase",
      !!M.deloadInfo({ settings: DELOAD }, "2026-02-05"));

    var normal = M.overloadSuggestion(stWith(NORMAL, topped), "bb-bench", slot, null, "2026-01-15");
    var deload = M.overloadSuggestion(stWith(DELOAD, topped), "bb-bench", slot, null, "2026-02-05");

    eq("outside the deload, a topped-out block still says add load", normal.action, "add-load");
    eq("in the deload it holds instead", deload.action, "deload-hold");
    eq("and the tone drops from push to hold", [normal.tone, deload.tone], ["push", "hold"]);
    ok("it says the increase was earned, not lost",
      /earned/i.test(deload.detail) && /next phase/i.test(deload.detail));
    ok("the deload note is attached for the UI", !!deload.deload);
    eq("and it is flagged as having held an increase", deload.deloadHeld, true);

    // the engine already agreeing must not be overridden or double-announced
    var holdInDeload = M.overloadSuggestion(stWith(DELOAD, midRange), "bb-bench", slot, null, "2026-02-05");
    eq("a hold in the deload keeps its own action", holdInDeload.action, "hold-add-reps");
    eq("and is not counted as an increase held back", holdInDeload.deloadHeld, false);
    ok("but the deload note is still shown", !!holdInDeload.deload);

    // the underlying recommendation is untouched — the plan is not rewritten
    eq("the base recommendation still knows load was earned",
      deload.recommendation.base.action, "add-load");
    eq("and still carries the target it would have set",
      deload.recommendation.base.targetWeightKg, 62.5);
    eq("the prescription itself is never edited",
      [slot.sets, slot.repLow, slot.repHigh], [4, 6, 9]);
  })();

  eq("missing RIR on a set → confidence low",
    M.overloadSuggestion(stateWithLast("bb-bench", [S(60, 9, 2), S(60, 9, 2), S(60, 9, 2), S(60, 9, null)]), "bb-bench", slot).confidence, "low");
  ok("push headline names a heavier number",
    /62\.5 kg/.test(M.overloadSuggestion(stateWithLast("bb-bench", [S(60, 9, 2), S(60, 9, 2), S(60, 9, 2), S(60, 9, 2)]), "bb-bench", slot).headline));
  ok("dumbbell push adds 2 kg",
    /26 kg/.test(M.overloadSuggestion(stateWithLast("incline-db-press", [S(24, 12, 3), S(24, 12, 2), S(24, 12, 2)]), "incline-db-press", { sets: 3, repLow: 8, repHigh: 12, rir: 2, loadIncrementKg: null }).headline));
  ok("slot loadIncrementKg overrides the exercise default",
    /61.25 kg/.test(M.overloadSuggestion(stateWithLast("bb-bench", [S(60, 9, 2), S(60, 9, 2), S(60, 9, 2), S(60, 9, 2)]), "bb-bench", { sets: 4, repLow: 6, repHigh: 9, rir: 2, loadIncrementKg: 1.25 }).headline));

  // ================= Stage 2: progression engine =================
  function expo(dateSuffix, exId, sets, prescription) {
    return { id: "s" + dateSuffix, status: "completed", date: "2026-08-" + dateSuffix,
      startedAt: "2026-08-" + dateSuffix + "T16:00:00Z", phase: 1, week: 2,
      entries: [{ exerciseId: exId, slot: prescription || null, sets: sets }] };
  }
  function stateOf(sessions) { return { exercises: ex, activeSession: null, sessions: sessions }; }
  var SLOT = { sets: 4, repLow: 6, repHigh: 9, rir: 2, loadIncrementKg: null };

  // loading patterns
  eq("pattern: straight", M.loadingPattern([S(60, 8, 2), S(60, 8, 2)]), "straight");
  eq("pattern: top set then back-offs", M.loadingPattern([S(100, 5, 1), S(90, 8, 2), S(90, 8, 2)]), "top-set-backoff");
  eq("pattern: ascending is varied", M.loadingPattern([S(80, 8, 3), S(90, 6, 2), S(100, 4, 1)]), "varied");

  // exposures returns newest-first, one per session, valid only
  var stEx = stateOf([expo("21", "bb-bench", [S(60, 8, 2)]), expo("25", "bb-bench", [S(62.5, 8, 2)])]);
  eq("exposures newest first", M.exposures(stEx, "bb-bench").map(function (e) { return e.date; }), ["2026-08-25", "2026-08-21"]);
  eq("exposures limit works", M.exposures(stEx, "bb-bench", null, 1).length, 1);

  // --- the four base actions ---
  var rAdd = M.recommendation(stateOf([expo("25", "bb-bench", [S(60, 9, 2), S(60, 9, 2), S(60, 9, 2), S(60, 9, 3)], SLOT)]), "bb-bench", SLOT);
  eq("add-load when every set tops the range at target RIR", rAdd.base.action, "add-load");
  eq("add-load target is last top + increment", rAdd.base.targetWeightKg, 62.5);
  ok("add-load reason cites reps and RIR", /9 reps at RIR 2/.test(rAdd.base.reason));
  eq("add-load confidence ok", rAdd.confidence.level, "ok");

  var rHold = M.recommendation(stateOf([expo("25", "bb-bench", [S(60, 7, 2), S(60, 7, 2), S(60, 7, 2), S(60, 7, 2)], SLOT)]), "bb-bench", SLOT);
  eq("hold-add-reps inside the range", rHold.base.action, "hold-add-reps");
  eq("hold target keeps the weight", rHold.base.targetWeightKg, 60);
  eq("hold target names a total-rep goal", rHold.base.targetRepsTotal, 29);

  var rCons = M.recommendation(stateOf([expo("25", "bb-bench", [S(60, 8, 2), S(60, 4, 0)], SLOT)]), "bb-bench", SLOT);
  eq("consolidate after one bad session", rCons.base.action, "consolidate");
  ok("consolidate explains the rep floor", /below 6 reps/.test(rCons.base.reason));

  // two bad sessions in a row at the same weight -> reduce
  var rRed = M.recommendation(stateOf([
    expo("21", "bb-bench", [S(60, 8, 2), S(60, 4, 0)], SLOT),
    expo("25", "bb-bench", [S(60, 7, 1), S(60, 5, 0)], SLOT)
  ]), "bb-bench", SLOT);
  eq("reduce-load only after repeated underperformance", rRed.base.action, "reduce-load");
  eq("reduce target is one increment down", rRed.base.targetWeightKg, 57.5);
  ok("reduce reason cites both dates", /21 Aug/.test(rRed.base.reason) && /25 Aug/.test(rRed.base.reason));
  ok("reduce offers the cut-a-set alternative", /3 working sets/.test(rRed.base.reason));

  // a single bad session after a good one does NOT reduce
  eq("one bad session after a good one → consolidate, not reduce",
    M.recommendation(stateOf([
      expo("21", "bb-bench", [S(60, 9, 2), S(60, 9, 2)], SLOT),
      expo("25", "bb-bench", [S(60, 4, 0)], SLOT)
    ]), "bb-bench", SLOT).base.action, "consolidate");

  // bad twice but at different weights -> not a reduce
  eq("repeated underperformance at different weights → consolidate",
    M.recommendation(stateOf([
      expo("21", "bb-bench", [S(70, 4, 0)], SLOT),
      expo("25", "bb-bench", [S(60, 4, 0)], SLOT)
    ]), "bb-bench", SLOT).base.action, "consolidate");

  // --- variable loading is preserved, not flattened ---
  var rPat = M.recommendation(stateOf([expo("25", "bb-bench", [S(100, 9, 2), S(90, 9, 2), S(90, 9, 2), S(90, 9, 2)], SLOT)]), "bb-bench", SLOT);
  eq("top-set/back-off pattern detected", rPat.base.pattern, "top-set-backoff");
  ok("add-load keeps the back-off shape", /102\.5 kg top/.test(rPat.base.patternNote) && /92\.5 kg back-offs/.test(rPat.base.patternNote));
  var rVar = M.recommendation(stateOf([expo("25", "bb-bench", [S(80, 7, 2), S(90, 7, 2), S(85, 7, 2)], SLOT)]), "bb-bench", SLOT);
  eq("varied loading flagged", rVar.base.pattern, "varied");
  ok("varied note lists the weights and says the target is the top set",
    /80 kg/.test(rVar.base.patternNote) && /heaviest set/.test(rVar.base.patternNote));
  eq("varied target is the heaviest weight", rVar.base.targetWeightKg, 90);

  // --- confidence ---
  var rNoRir = M.recommendation(stateOf([expo("25", "bb-bench", [S(60, 9, 2), S(60, 9, 2), S(60, 9, 2), S(60, 9, null)], SLOT)]), "bb-bench", SLOT);
  eq("missing RIR lowers confidence", rNoRir.confidence.level, "low");
  ok("and says why", /RIR wasn't logged/.test(rNoRir.confidence.reasons[0]));
  var rFew = M.recommendation(stateOf([expo("25", "bb-bench", [S(60, 9, 2)], SLOT)]), "bb-bench", SLOT);
  eq("too few working sets lowers confidence", rFew.confidence.level, "low");
  ok("and says how few", /1 of 4 working sets/.test(rFew.confidence.reasons[0]));
  eq("too few sets also blocks add-load", rFew.base.action !== "add-load", true);
  eq("no history → confidence none", M.recommendation(stateOf([]), "bb-bench", SLOT).confidence.level, "none");
  eq("no history → establish", M.recommendation(stateOf([]), "bb-bench", SLOT).base.action, "establish");

  // --- prescription changed too much to compare ---
  var oldPrescription = { sets: 4, repLow: 15, repHigh: 20, rir: 1 };
  var rInc = M.recommendation(stateOf([expo("25", "bb-bench", [S(30, 18, 1), S(30, 18, 1)], oldPrescription)]), "bb-bench", SLOT);
  eq("wildly different prescription → not comparable", rInc.base.action, "establish");
  ok("headline says so", /Not enough comparable data/.test(rInc.base.headline));
  eq("comparable: same prescription", M.prescriptionComparable(SLOT, SLOT), true);
  eq("comparable: small rep-range shift", M.prescriptionComparable({ sets: 4, repLow: 6, repHigh: 9 }, { sets: 4, repLow: 8, repHigh: 12 }), true);
  eq("not comparable: 6–9 vs 15–20", M.prescriptionComparable({ sets: 4, repLow: 6, repHigh: 9 }, oldPrescription), false);
  eq("not comparable: 2 vs 5 sets", M.prescriptionComparable({ sets: 2, repLow: 6, repHigh: 9 }, { sets: 5, repLow: 6, repHigh: 9 }), false);

  // --- increments feed the target ---
  eq("dumbbell add-load uses 2 kg",
    M.recommendation(stateOf([expo("25", "incline-db-press", [S(24, 12, 2), S(24, 12, 2), S(24, 12, 2)], { sets: 3, repLow: 8, repHigh: 12, rir: 2, loadIncrementKg: null })]),
      "incline-db-press", { sets: 3, repLow: 8, repHigh: 12, rir: 2, loadIncrementKg: null }).base.targetWeightKg, 26);
  eq("slot override beats the exercise default",
    M.recommendation(stateOf([expo("25", "bb-bench", [S(60, 9, 2), S(60, 9, 2), S(60, 9, 2), S(60, 9, 2)], SLOT)]),
      "bb-bench", { sets: 4, repLow: 6, repHigh: 9, rir: 2, loadIncrementKg: 1.25 }).base.targetWeightKg, 61.25);

  // --- warm-ups and drops never influence the engine ---
  var rWU = M.recommendation(stateOf([expo("25", "bb-bench",
    [S(200, 1, 0, "warmup"), S(60, 9, 2), S(60, 9, 2), S(60, 9, 2), S(60, 9, 2), S(20, 20, 0, "drop")], SLOT)]), "bb-bench", SLOT);
  eq("warm-up/drop excluded → still a clean add-load", rWU.base.action, "add-load");
  eq("target ignores the 200 kg warm-up", rWU.base.targetWeightKg, 62.5);

  // --- compact wrapper stays in sync ---
  var sugW = M.overloadSuggestion(stateOf([expo("25", "bb-bench", [S(60, 9, 2), S(60, 9, 2), S(60, 9, 2), S(60, 9, 2)], SLOT)]), "bb-bench", SLOT);
  eq("wrapper tone", sugW.tone, "push");
  eq("wrapper headline matches base", sugW.headline, rAdd.base.headline);
  eq("confidenceText is null when confident", M.confidenceText("ok", []), null);
  ok("confidenceText explains a low level", /Lower confidence/.test(M.confidenceText("low", ["RIR wasn't logged on every working set."])));

  // --- PR labels: one badge, the rest in the detail ---
  eq("prAllLabels lists every record", M.prAllLabels(["weight", "e1rm"], 65), ["Heaviest ever", "Best estimated 1RM"]);
  eq("prAllLabels names the weight for a rep record", M.prAllLabels(["repsAtWeight"], 42.5), ["Most reps at 42.5 kg"]);

  // --- recomputeSessionPRs walks chronologically; warm-ups never PR ---
  var stPR = { sessions: [], exercises: ex };
  var s1 = { id: "x", status: "completed", startedAt: "2026-08-01T16:00:00Z",
    entries: [{ exerciseId: "bb-bench", sets: [S(40, 5, 4, "warmup"), S(60, 8, 2), S(65, 8, 2), S(65, 9, 1)] }] };
  M.recomputeSessionPRs(stPR, s1);
  eq("warm-up set never flags a PR", s1.entries[0].sets[0].prFlags, []);
  eq("first working set: nothing to beat", s1.entries[0].sets[1].prFlags, []);
  eq("2nd working set: weight PR", s1.entries[0].sets[2].prFlags.indexOf("weight") > -1, true);
  eq("3rd working set: repsAtWeight PR", s1.entries[0].sets[3].prFlags.indexOf("repsAtWeight") > -1, true);

  // --- recomputeAllPRs across sessions, abandoned excluded ---
  var stAll = { exercises: ex, sessions: [
    { id: "a", status: "completed", startedAt: "2026-08-01T16:00:00Z", entries: [{ exerciseId: "bb-bench", sets: [S(60, 8, 2)] }] },
    { id: "b", status: "abandoned", startedAt: "2026-08-03T16:00:00Z", entries: [{ exerciseId: "bb-bench", sets: [S(200, 8, 2)] }] },
    { id: "c", status: "completed", startedAt: "2026-08-05T16:00:00Z", entries: [{ exerciseId: "bb-bench", sets: [S(62.5, 8, 2)] }] }
  ] };
  M.recomputeAllPRs(stAll);
  eq("abandoned session's monster set is not a PR", stAll.sessions[1].entries[0].sets[0].prFlags, []);
  eq("later real session still gets its weight PR (abandoned ignored)",
    stAll.sessions[2].entries[0].sets[0].prFlags.indexOf("weight") > -1, true);

  document.getElementById("summary").innerHTML =
    (fail === 0 ? '<span class="ok">' : '<span class="fail">') + pass + " passed, " + fail + " failed</span>";
})();
</script>
