<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach — review &amp; progress tests</title>
<style>
  body{font:14px/1.5 -apple-system,system-ui,sans-serif; margin:24px; max-width:820px}
  h1{font-size:18px}
  .ok{color:#1a7f37} .fail{color:#c4362a; font-weight:700}
  .row{padding:3px 0; border-bottom:1px solid #eee}
  #summary{margin:14px 0; font-weight:700; font-size:15px}
</style>
</head>
<body>
<h1>Coach — weekly review, volume &amp; progress (Stage 3)</h1>
<div id="summary">running…</div>
<div id="out"></div>

<script src="../js/util.js"></script>
<script src="../js/data.js"></script>
<script src="../js/model.js"></script>
<script>
(function () {
  var M = App.model, out = document.getElementById("out"), pass = 0, fail = 0;
  function ok(name, cond) {
    var d = document.createElement("div");
    d.className = "row " + (cond ? "ok" : "fail");
    d.textContent = (cond ? "PASS  " : "FAIL  ") + name;
    out.appendChild(d); cond ? pass++ : fail++;
  }
  function eq(name, a, b) { ok(name + "  → " + JSON.stringify(a), JSON.stringify(a) === JSON.stringify(b)); }
  function S(w, r, rir, t) { return { id: "x", order: 0, type: t || "working", weightKg: w, reps: r, rir: rir === undefined ? 2 : rir, e1rm: M.epley(w, r), prFlags: [] }; }

  var SETTINGS = { phaseStartDate: "2026-08-03", phaseLengthWeeks: 6 };   // a Monday

  // ---- week maths ----
  eq("addDays crosses a month", M.addDays("2026-08-31", 1), "2026-09-01");
  eq("addDays backwards", M.addDays("2026-09-01", -1), "2026-08-31");
  eq("week 0 contains the phase start", M.weekIndexOf(SETTINGS, "2026-08-03"), 0);
  eq("week 0 contains its Sunday", M.weekIndexOf(SETTINGS, "2026-08-09"), 0);
  eq("next Monday starts week 1", M.weekIndexOf(SETTINGS, "2026-08-10"), 1);
  eq("dates before the block go negative", M.weekIndexOf(SETTINGS, "2026-08-02"), -1);
  eq("weekBounds is Mon–Sun", M.weekBounds(SETTINGS, 1), { start: "2026-08-10", end: "2026-08-16" });
  eq("weekLabel maps index to phase + week", M.weekLabel(SETTINGS, 7), "Phase 2 · Week 2");
  eq("weekLabel handles pre-block dates", M.weekLabel(SETTINGS, -1), "Before this block");

  // ---- fixtures ----
  function sess(id, date, dayId, entries, status) {
    var pi = M.phaseInfo(SETTINGS, date);
    return { id: id, programVersionId: "pv1", dayId: dayId, dayName: dayId,
      startMode: "scheduled", status: status || "completed",
      startedAt: date + "T16:00:00Z", date: date, phase: pi.phase, week: pi.week,
      rotationPositionSnapshot: 0, advancesRotation: true, entries: entries };
  }
  function entry(exId, sets, planned) {
    return { id: "e" + exId, planSlotId: planned ? "push.s1" : null, exerciseId: exId,
      prescribedExerciseId: exId, slot: planned ? { sets: planned, repLow: 6, repHigh: 9, rir: 2 } : null, sets: sets };
  }
  function state(sessions) {
    return { settings: SETTINGS, exercises: App.EXERCISE_SEED, activeSession: null,
      programVersions: [App.PROGRAM_SEED], activeProgramVersionId: "pv1", sessions: sessions };
  }

  // ---- muscle volume ----
  var volState = state([
    sess("a", "2026-08-10", "push", [
      entry("bb-bench", [S(60, 5, 4, "warmup"), S(60, 8), S(60, 8)], 3),   // chest 2 (warm-up excluded)
      entry("cable-lateral", [S(12, 15), S(12, 15), S(12, 14)], 3)          // shoulders 3
    ]),
    sess("b", "2026-08-12", "lower", [entry("back-squat", [S(100, 8), S(100, 8)], 4)])   // legs 2
  ]);
  var vol = M.muscleVolume(volState, volState.sessions);
  eq("volume counts working sets by primary muscle", [vol.chest, vol.shoulders, vol.legs], [2, 3, 2]);
  eq("volume ignores warm-ups", vol.chest, 2);
  eq("untouched groups are zero, not missing", [vol.back, vol.arms, vol.core], [0, 0, 0]);
  eq("abandoned sessions contribute nothing",
    M.muscleVolume(volState, [sess("z", "2026-08-10", "push", [entry("bb-bench", [S(200, 10)], 3)], "abandoned")]).chest, 0);
  eq("partial sessions DO count",
    M.muscleVolume(volState, [sess("z", "2026-08-10", "push", [entry("bb-bench", [S(60, 10)], 3)], "partial")]).chest, 1);

  // ---- planned vs completed ----
  var pvc = M.plannedVsCompleted(volState.sessions);
  eq("planned sums the prescriptions", pvc.planned, 10);
  eq("completed counts logged working sets", pvc.completed, 7);
  eq("freestyle entries add to completed but not planned",
    M.plannedVsCompleted([sess("f", "2026-08-10", "push", [entry("ab-wheel", [S(0, 12), S(0, 12)], null)])]),
    { planned: 0, completed: 2 });

  // ---- sessionsInWeek ----
  var wkState = state([
    sess("w0", "2026-08-09", "push", [entry("bb-bench", [S(60, 8)], 3)]),   // last day of week 0
    sess("w1a", "2026-08-10", "push", [entry("bb-bench", [S(62.5, 8)], 3)]),
    sess("w1b", "2026-08-16", "pull", [entry("bb-row", [S(70, 8)], 4)]),    // last day of week 1
    sess("w2", "2026-08-17", "push", [entry("bb-bench", [S(65, 8)], 3)])
  ]);
  eq("week 1 holds exactly its Mon–Sun sessions",
    M.sessionsInWeek(wkState, 1).map(function (s) { return s.id; }), ["w1a", "w1b"]);
  eq("boundaries don't leak", M.sessionsInWeek(wkState, 0).map(function (s) { return s.id; }), ["w0"]);

  // ---- weekly review ----
  var r1 = M.weeklyReview(wkState, 1);
  eq("review label", r1.label, "Phase 1 · Week 2");
  eq("review session count", r1.sessionCount, 2);
  eq("review planned/completed", [r1.planned, r1.completed], [7, 2]);
  ok("under 80% of planned is called out", r1.notes.some(function (n) { return /2 of 7 prescribed/.test(n); }));

  var empty = M.weeklyReview(wkState, 40);
  eq("an empty week says so", empty.sessionCount, 0);
  ok("empty week note", empty.notes.some(function (n) { return /No sessions logged/.test(n); }));

  // missing-data reporting
  var missState = state([
    sess("m1", "2026-08-10", "push", [entry("bb-bench", [S(60, 8, null), S(60, 8, 2)], 3)], "partial")
  ]);
  var rm = M.weeklyReview(missState, 1);
  ok("missing RIR is reported", rm.missing.some(function (m) { return /1 of 2 working sets had no RIR/.test(m); }));
  ok("partial sessions are reported", rm.missing.some(function (m) { return /finished as partial/.test(m); }));
  ok("untracked stages are declared, not faked", rm.missing.some(function (m) { return /isn't tracked yet/.test(m); }));
  ok("a week with no meals logged says so", rm.missing.some(function (m) { return /No meal checkpoints logged/.test(m); }));
  ok("a week with no weigh-ins says so", rm.missing.some(function (m) { return /No weigh-ins this week/.test(m); }));
  ok("too few weigh-ins to read a trend is called out", (function () {
    var st6 = state([sess("q", "2026-08-10", "push", [entry("bb-bench", [S(60, 8)], 3)])]);
    st6.bodyweights = [{ entryId: "b1", date: "2026-08-11", kg: 83, note: "" },
                       { entryId: "b2", date: "2026-08-13", kg: 83.2, note: "" }];
    return M.weeklyReview(st6, 1).missing.some(function (m) { return /Only 2 weigh-ins this week/.test(m); });
  })());
  ok("a fully-logged week doesn't nag about meals or weigh-ins", (function () {
    var st7 = state([sess("r", "2026-08-10", "push", [entry("bb-bench", [S(60, 8), S(60, 8), S(60, 8)], 3)])]);
    st7.nutritionDays = []; st7.bodyweights = [];
    for (var i = 0; i < 7; i++) {
      var d = M.addDays("2026-08-10", i);
      st7.bodyweights.push({ entryId: "w" + i, date: d, kg: 83 + i * 0.03, note: "" });
      st7.nutritionDays.push({ date: d, checkpoints: App.NUTRITION_SEED.checkpoints.map(function (c, k) {
        return { index: k, id: c.id, state: "done", largerPortion: false, at: null }; }) });
    }
    st7.settings.mealPlan = App.NUTRITION_SEED;
    var miss = M.weeklyReview(st7, 1).missing.join(" ");
    return !/No meal checkpoints/.test(miss) && !/No weigh-ins/.test(miss) && !/Only \d+ weigh-ins/.test(miss);
  })());
  ok("heavy missing RIR becomes an observation", rm.notes.some(function (n) { return /RIR is missing/.test(n); }));

  // dropped muscle group vs the previous week
  var dropState = state([
    sess("d1", "2026-08-10", "lower", [entry("back-squat", [S(100, 8), S(100, 8)], 4)]),
    sess("d2", "2026-08-17", "push", [entry("bb-bench", [S(60, 8), S(60, 8)], 3)])
  ]);
  var rd = M.weeklyReview(dropState, 2);
  ok("a muscle group that vanished is flagged with last week's number",
    rd.notes.some(function (n) { return /No legs sets this week/.test(n) && /2 legs last week/.test(n); }));

  // movers: only meaningful changes, biggest first
  var movState = state([
    sess("v1", "2026-08-10", "push", [entry("bb-bench", [S(60, 8)], 3), entry("ohp", [S(40, 8)], 3)]),
    sess("v2", "2026-08-17", "push", [entry("bb-bench", [S(70, 8)], 3), entry("ohp", [S(40, 8)], 3)])
  ]);
  var rv = M.weeklyReview(movState, 2);
  eq("only exercises that actually moved appear", rv.movers.map(function (m) { return m.exerciseId; }), ["bb-bench"]);
  ok("mover delta is the estimated-1RM change", Math.abs(rv.movers[0].deltaE1rm - (M.epley(70, 8) - M.epley(60, 8))) < 0.02);
  // the review reports the PR flags stamped at save time, it doesn't re-derive them
  eq("no stamped flags → no PRs reported", rv.prs.length, 0);
  M.recomputeAllPRs(movState);
  eq("after a restamp the week reports the PR", M.weeklyReview(movState, 2).prs.length, 1);
  eq("and names the exercise", M.weeklyReview(movState, 2).prs[0].exerciseId, "bb-bench");

  // ---- per-exercise progress ----
  var progState = state([
    sess("p1", "2026-08-10", "push", [entry("bb-bench", [S(50, 5, 4, "warmup"), S(60, 8), S(60, 7)], 3)]),
    sess("p2", "2026-08-17", "push", [entry("bb-bench", [S(65, 8), S(65, 6)], 3)]),
    sess("p3", "2026-08-19", "push", [entry("bb-bench", [S(200, 1)], 3)], "abandoned")
  ]);
  var prog = M.exerciseProgress(progState, "bb-bench");
  eq("progress is oldest-first", prog.map(function (p) { return p.date; }), ["2026-08-10", "2026-08-17"]);
  eq("abandoned session excluded from progress", prog.length, 2);
  eq("top weight ignores warm-ups", prog[0].topWeight, 60);
  eq("reps at top set", prog[0].repsAtTop, 8);
  eq("working set count excludes warm-ups", prog[0].setCount, 2);
  eq("total reps", prog[0].totalReps, 15);
  ok("best e1RM per session", Math.abs(prog[1].bestE1rm - M.epley(65, 8)) < 0.02);

  // ---- records ----
  var rec = M.exerciseRecords(progState, "bb-bench");
  eq("heaviest ever", [rec.heaviest.weightKg, rec.heaviest.reps], [65, 8]);
  eq("abandoned 200 kg is not a record", rec.heaviest.weightKg, 65);
  eq("total working sets counted", rec.totalWorkingSets, 4);
  eq("no history → null records", M.exerciseRecords(state([]), "bb-bench"), null);

  // ---- exercisesWithHistory ----
  var listState = state([
    sess("l1", "2026-08-10", "push", [entry("bb-bench", [S(60, 8)], 3), entry("ohp", [S(40, 5, 4, "warmup")], 3)]),
    sess("l2", "2026-08-17", "push", [entry("cable-lateral", [S(12, 15)], 3)])
  ]);
  var hist = M.exercisesWithHistory(listState);
  eq("newest-used first", hist.map(function (h) { return h.exerciseId; }), ["cable-lateral", "bb-bench"]);
  eq("warm-up-only exercises are excluded", hist.filter(function (h) { return h.exerciseId === "ohp"; }).length, 0);
  eq("no duplicates across sessions", hist.length, 2);

  // --- cardio: the easy Zone 2 rides ---
  (function () {
    var settings = { phaseStartDate: "2026-01-01", phaseLengthWeeks: 6 };
    function stC(rides) { return { settings: settings, sessions: [], cardioSessions: rides }; }
    function ride(date, mins, hr) { return { id: "c" + date + mins, date: date, kind: "bike", minutes: mins, avgHrBpm: hr == null ? null : hr }; }

    // week 0 = 2026-01-01 .. 2026-01-07
    var stc = stC([ride("2026-01-02", 45, 132), ride("2026-01-05", 50, 128), ride("2026-01-20", 40, null)]);
    var w0 = M.cardioSummary(stc, 0);
    eq("counts only the rides inside the week", w0.rides, 2);
    eq("sums their minutes", w0.minutes, 95);
    eq("averages heart rate over the rides that have one", w0.avgHrBpm, 130);
    eq("one or two rides is on target", w0.onTarget, true);
    eq("nothing to flag when on target", w0.note, "");

    var none = M.cardioSummary(stC([]), 0);
    eq("a week with no rides reports zero", [none.rides, none.minutes], [0, 0]);
    eq("and no average HR to report", none.avgHrBpm, null);
    eq("an empty week is off target", none.onTarget, false);
    ok("and says so without calling it a failure",
      /optional/.test(none.note) && /choice rather than a failure/.test(none.note));

    var many = M.cardioSummary(stC([ride("2026-01-02", 40), ride("2026-01-03", 40),
      ride("2026-01-04", 40), ride("2026-01-05", 40)]), 0);
    eq("four rides is over target", many.onTarget, false);
    ok("and the note ties it back to lifting recovery", /recover/.test(many.note));

    var live = { settings: settings, sessions: [], cardioSessions: [] };
    var added = M.addCardio(live, { date: "2026-01-02", minutes: 45, avgHrBpm: 130 });
    eq("addCardio stores the ride", live.cardioSessions.length, 1);
    ok("and gives it an id", !!added.id);
    eq("a blank HR is stored as null, not 0",
      M.addCardio(live, { date: "2026-01-03", minutes: 30, avgHrBpm: "" }).avgHrBpm, null);
    eq("removeCardio removes it", [M.removeCardio(live, added.id), live.cardioSessions.length], [true, 1]);
    eq("removing an unknown id changes nothing", M.removeCardio(live, "nope"), false);
  })();

  document.getElementById("summary").innerHTML =
    (fail === 0 ? '<span class="ok">' : '<span class="fail">') + pass + " passed, " + fail + " failed</span>";
})();
</script>
</body>
</html>
